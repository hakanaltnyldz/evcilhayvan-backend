      .bg{fill:#f7fee7}.box{fill:#fff;stroke:#365314;stroke-width:2;rx:18}.actor{stroke:#1a2e05;stroke-width:3;fill:none}.line{stroke:#3f6212;stroke-width:2;fill:none}.inc{stroke:#64748b;stroke-width:2;stroke-dasharray:8 6;fill:none}.uc{fill:#dcfce7;stroke:#15803d;stroke-width:2}.txt{font-family:Arial, sans-serif;font-size:21px;fill:#172554}.small{font-family:Arial, sans-serif;font-size:17px;fill:#334155}.title{font-family:Arial, sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
