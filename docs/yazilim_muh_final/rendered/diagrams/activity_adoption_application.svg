  <polygon class="decision" points="500,270 650,340 500,410 350,340"/><text class="txt" x="415" y="348">Başvuru yapılacak mı?</text>
  <rect class="box" x="315" y="465" width="370" height="68"/><text class="txt" x="366" y="507">Başvuru Formunu Doldur</text>
  <rect class="box" x="315" y="585" width="370" height="68"/><text class="txt" x="360" y="627">İlan Sahibine Bildir</text>
  <polygon class="decision" points="500,705 650,775 500,845 350,775"/><text class="txt" x="400" y="783">İlan sahibi uygun mu?</text>
