  <rect class="box" x="535" y="900" width="300" height="68"/><text class="txt" x="600" y="942">Başvuruyu Reddet</text>
  <rect class="box" x="315" y="1030" width="370" height="68"/><text class="txt" x="386" y="1072">İlanı Kapat / Tamamla</text>
  <circle class="end" cx="500" cy="1140" r="22"/><circle class="start" cx="500" cy="1140" r="10"/>
  <line class="line" x1="500" y1="128" x2="500" y2="160" marker-end="url(#arrow)"/><line class="line" x1="500" y1="224" x2="500" y2="270" marker-end="url(#arrow)"/>
  <line class="line" x1="500" y1="410" x2="500" y2="465" marker-end="url(#arrow)"/><text class="small" x="520" y="445">Evet</text>
  <path class="line" d="M650 340 H820 V1130 H522" marker-end="url(#arrow)"/><text class="small" x="675" y="320">Hayır</text>
  <line class="line" x1="500" y1="533" x2="500" y2="585" marker-end="url(#arrow)"/><line class="line" x1="500" y1="653" x2="500" y2="705" marker-end="url(#arrow)"/>
  <line class="line" x1="420" y1="835" x2="320" y2="900" marker-end="url(#arrow)"/><text class="small" x="335" y="860">Evet</text>
  <line class="line" x1="580" y1="835" x2="685" y2="900" marker-end="url(#arrow)"/><text class="small" x="640" y="860">Hayır</text>
  <line class="line" x1="320" y1="968" x2="430" y2="1030" marker-end="url(#arrow)"/><line class="line" x1="685" y1="968" x2="570" y2="1030" marker-end="url(#arrow)"/>
  <line class="line" x1="500" y1="1098" x2="500" y2="1118" marker-end="url(#arrow)"/>
