<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180">
  <defs>
    <style>
      .bg{fill:#f8fafc}.start{fill:#0f172a}.end{fill:#fff;stroke:#0f172a;stroke-width:4}.box{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2;rx:14}.decision{fill:#fef3c7;stroke:#b45309;stroke-width:2}.line{stroke:#334155;stroke-width:2.5;fill:none}.txt{font-family:Arial, sans-serif;font-size:22px;fill:#0f172a}.small{font-family:Arial, sans-serif;font-size:18px;fill:#334155}.title{font-family:Arial, sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
  </defs>
  <rect class="bg" width="1000" height="1180"/>
