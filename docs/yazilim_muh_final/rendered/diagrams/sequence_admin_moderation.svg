  <rect class="head" x="775" y="95" width="130" height="48"/><text class="txt" x="812" y="125">MongoDB</text>
  <rect class="head" x="990" y="95" width="180" height="48"/><text class="txt" x="1015" y="125">Bildirim Servisi</text>
  <line class="life" x1="142" y1="143" x2="142" y2="705"/><line class="life" x1="377" y1="143" x2="377" y2="705"/><line class="life" x1="615" y1="143" x2="615" y2="705"/><line class="life" x1="840" y1="143" x2="840" y2="705"/><line class="life" x1="1080" y1="143" x2="1080" y2="705"/>
