<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="760" viewBox="0 0 1250 760">
  <defs>
    <style>
      .bg{fill:#f8fafc}.head{fill:#e2e8f0;stroke:#334155;stroke-width:2;rx:10}.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:8 7}.msg{stroke:#334155;stroke-width:2.2;fill:none}.ret{stroke:#64748b;stroke-width:2;stroke-dasharray:7 6;fill:none}.txt{font-family:Arial, sans-serif;font-size:18px;fill:#0f172a}.title{font-family:Arial, sans-serif;font-size:30px;font-weight:700;fill:#0f172a}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#334155"/></marker>
