<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900">
  <defs>
    <style>
      .bg{fill:#ffffff}.proc{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2}.store{fill:#f5f3ff;stroke:#7c3aed;stroke-width:2}.actor{fill:#ecfccb;stroke:#4d7c0f;stroke-width:2}.txt{font:17px Arial, sans-serif;fill:#0f172a}.small{font:14px Arial, sans-serif;fill:#334155}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#475569"/>
