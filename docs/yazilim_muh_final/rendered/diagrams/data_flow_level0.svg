  <rect class="proc" x="360" y="225" width="260" height="75" rx="12"/><text class="txt" x="490" y="258" text-anchor="middle">2. Pet ve Ilan</text><text class="small" x="490" y="282" text-anchor="middle">pet, ilan, basvuru</text>
