  <defs><style>.act{fill:#dcfce7;stroke:#15803d;stroke-width:2}.dec{fill:#fef3c7;stroke:#b45309;stroke-width:2}.end{fill:#111827}.txt{font:16px Arial,sans-serif;fill:#0f172a}.line{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#334155"/></marker></defs>
