services:
  - type: web
    name: evcilhayvan-backend
    env: node
    region: frankfurt
    plan: free
    buildCommand: cd evcilhayvan && npm install
    startCommand: cd evcilhayvan && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES
        value: 7d
      - key: CORS_ORIGIN
        value: "*"
      - key: SENDER_EMAIL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
  - type: web
    name: evcilhayvan-admin
    env: static
    # Unified web panel: admin workspace + seller workspace under /seller/*
    # Legacy standalone seller app in evcilhayvan_seller/ is not deployed here.
    buildCommand: cd evcilhayvan_admin && npm install && npm run build
    staticPublishPath: evcilhayvan_admin/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://evcilhayvan-backend.onrender.com/api
